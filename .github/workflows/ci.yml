name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancelar runs anteriores del mismo PR al pushear nuevos commits
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # prisma generate (postinstall) requiere que la var exista; no se conecta a la DB.
  # NUNCA usar la URL real de producción aquí: los tests mockean @/lib/prisma.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  typecheck:
    name: TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # El repo (~140k líneas) excede el heap default de Node; mismo ajuste que usa `npm run build`.
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # IMPORTANTE: la suite se cuelga con Node 22 (jsdom/whatwg-url).
          # Ver comentario en vitest.config.ts. Mantener Node 20 hasta resolverlo.
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Los tests del firmador AEC (src/lib/sii) invocan aec_signer.py, que
      # necesita lxml + cryptography en el Python del runner.
      - name: Install Python deps (firmador AEC)
        run: python3 -m pip install --upgrade lxml cryptography cffi

      - name: Run tests
        run: npx vitest run

  design-system:
    name: Design System guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Solo aplica en PRs: replica el pre-commit (archivos cambiados, lógica
    # per-file de MIGRATED_PATHS). NO usar --all: los módulos aún no migrados
    # tienen ~11k violaciones legacy conocidas y bloquearían todo.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stage changed files
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "No files changed."
            exit 0
          fi
          echo "$CHANGED" | while read -r f; do
            [ -f "$f" ] && git add "$f" 2>/dev/null || true
          done

      # check-design-system.mjs solo usa builtins de Node — no necesita npm ci.
      # Sin --all corre en modo staged: mismo comportamiento que el pre-commit.
      - name: Check design system
        run: node scripts/check-design-system.mjs
